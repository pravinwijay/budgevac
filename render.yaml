services:
  - type: web
    name: mysg-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysg-db
          property: connectionString
      - key: DB_DIALECT
        value: postgres

databases:
  - name: mysg-db
    plan: free
